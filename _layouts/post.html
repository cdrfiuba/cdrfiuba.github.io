---
layout: default
---
{% include wrap.html %}

<div class="container mtb">
    <div class="row">
        <article class="col-lg-8">
            <h1>{{ page.title }}</h1>
            <p><time datetime="{{ page.date | date_to_xmlschema }}" class="csmall">{% include date.html date=page.date %}</time></p>
            <div class="post-img-wrap">
                <img src="{{ '/assets/img/blog/' | append: page.img | relative_url }}" alt="{{ page.title | strip_html }}" loading="lazy">
            </div>

            {{ content }}

            <div class="spacing"></div>

            <!-- Comentarios (Utterances, respaldados por GitHub Issues) -->
            <script src="https://utteranc.es/client.js"
                    repo="cdrfiuba/cdrfiuba.github.io"
                    issue-term="pathname"
                    theme="github-light"
                    crossorigin="anonymous"
                    async>
            </script>
        </article>

        {% include sidebar.html %}
    </div>
</div>
