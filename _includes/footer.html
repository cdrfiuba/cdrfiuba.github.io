<footer id="footerwrap">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 mb-4 mb-lg-0">
                <h4>Redes Sociales</h4>
                <div class="hline-w" aria-hidden="true"></div>
                <p class="social-links">
                    {% for network in site.data.social %}
                        <a href="{{ network.url }}" rel="noopener noreferrer">
                            <span class="social-icon" aria-hidden="true">{% include icons/{{ network.name }}.svg %}</span>
                            <span class="visually-hidden">{{ network.title }}</span>
                        </a>
                    {% endfor %}
                </p>
            </div>
            <div class="col-lg-6">
                <h4>Contacto</h4>
                <div class="hline-w" aria-hidden="true"></div>
                {% include address.html %}
            </div>
        </div>
        <p class="footer-credit">© {{ 'now' | date: "%Y" }} {{ site.title }}</p>
    </div>
</footer>
