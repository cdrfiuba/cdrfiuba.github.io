<aside class="col-lg-4">
    <h4>Anuncios recientes</h4>
    <div class="hline" aria-hidden="true"></div>
    <ul class="popular-posts">
        {% for post in site.categories.novedades limit:4 %}
            <li>
                <p><a href="{{ post.url | relative_url }}">{{ post.title }}</a></p>
                <em>{% include date.html date=post.date %}</em>
            </li>
        {% endfor %}
    </ul>
</aside>
