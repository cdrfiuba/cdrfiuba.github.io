---
layout: page
title: Novedades
permalink: /novedades/
---

<div class="container mtb">
    <div class="row">
        <div class="col-lg-8">
            {% for post in site.categories.novedades %}
                <article>
                    <h3 class="ctitle"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
                    <p><time datetime="{{ post.date | date_to_xmlschema }}" class="csmall">{% include date.html date=post.date %}</time></p>
                    <div class="post-img-wrap">
                        <a href="{{ post.url | relative_url }}">
                            <img src="{{ '/assets/img/blog/' | append: post.img | relative_url }}" alt="{{ post.title | strip_html }}" loading="lazy">
                        </a>
                    </div>
                    {{ post.excerpt }}
                    <p><a href="{{ post.url | relative_url }}">Leer más</a></p>
                    <div class="hline" aria-hidden="true"></div>
                    <div class="spacing"></div>
                </article>
            {% endfor %}
        </div>

        {% include sidebar.html %}
    </div>
</div>
